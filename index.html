<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>creaturely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* the animations' own ground */
  --ground:#f8fefe;
  /* the creaturely title purple from Animation 1 */
  --title:#dac7db;
  --focus:#A5CBE0;
  --mono:"DejaVu Sans Mono","Noto Sans Mono","Menlo","Consolas",monospace;
  --serif:"EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);
  font-family:var(--mono);
  min-height:100vh;
}

/* ---------- the word ---------- */
#intro{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:20;
}
#word{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.8rem,9.6vw,6rem);
  letter-spacing:0.06em;
  color:var(--title);
  display:flex;align-items:baseline;
}
#word span.ch{
  display:inline-block;
  opacity:0;
}
#word span.ch.in{opacity:1;transition:opacity 2800ms ease}
#word span.ch.out{
  opacity:0;transform:translateY(-14px);filter:blur(2px);
  transition:opacity 2600ms ease, transform 2600ms ease, filter 2600ms ease;
}
#cursor{
  display:inline-block;width:0.55em;height:1.05em;margin-left:0.08em;
  background:var(--title);opacity:0;align-self:center;
  transition:opacity 1200ms ease;
}
#cursor.blink{animation:blink 1.06s steps(1) infinite}
@keyframes blink{0%,55%{opacity:0.85}56%,100%{opacity:0}}
#cursor.gone{animation:none;opacity:0}

/* ---------- the canvas: every creature lives here ---------- */
#cloud{position:fixed;inset:0;z-index:10;pointer-events:none}

/* ---------- invisible plate: hit areas only ---------- */
#plate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:2rem 1rem 3rem;
}
#ring{margin-bottom:min(3vw,3vh)}
/* the collar: twelve creatures on a ring, clasp at the bottom,
   the centre left empty where the neck would go */
#ring{
  position:relative;
  width:min(94vw,100vh);
  aspect-ratio:1/1;
}
.motif{
  display:block;border-radius:50%;
  position:absolute;transform:translate(-50%,-50%);
  pointer-events:none;
}
body.done .motif,.motif.ready{pointer-events:auto;cursor:pointer}
.motif:focus{outline:none}
.motif:focus-visible{outline:1px solid var(--focus);outline-offset:6px;opacity:1}
.cloudbox{width:100%;aspect-ratio:1/1}
/* a faint index beneath each cloud: present once the ring has settled, quiet while touched */
.motif{overflow:visible}
.motif .entry{position:absolute;left:50%;top:94%;transform:translate(-50%,0);white-space:normal;width:150%;text-align:center;line-height:1.5;
  font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:0.68rem;letter-spacing:0.06em;text-transform:none;font-style:italic;font-family:var(--serif);
  color:#8A8D87;opacity:0;transition:opacity 0.9s ease 0s;pointer-events:none}
.motif.glyph .entry{top:100%}
.motif .entry{display:none}
#copyline{position:fixed;right:1.3rem;bottom:0.9rem;text-align:right;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:0.5rem;letter-spacing:0.14em;text-transform:uppercase;color:#8A8D87;opacity:0;transition:opacity 1.6s ease;pointer-events:none;z-index:5}
body.done #copyline{opacity:0.6}
</style>
</head>
<body>

<div id="intro" aria-hidden="true">
  <div id="word"></div>
</div>
<canvas id="cloud" aria-hidden="true"></canvas>

<main id="plate">
  <nav id="ring" aria-label="Creaturely"></nav>
</main>

  "asterisk":     {base:"#A5CBE0", deep:"#5E87A0", tw:0.22, dots:false},
  "ampersand":    {base:"#C49A90", deep:"#8A5A50", tw:0.22, dots:false}
};

const CHARS = {
  /* the clouds speak in numbers and scientific symbols;
     only the arriving word still carries letters */
  photonic:"0123456789\u03bb\u0394\u221a\u03c0\u221e",
  sonic:"0123456789\u2211\u2248\u00b1\u03b8\u03c0",
  tactile:"0123456789\u00d7+=\u222b\u0394",
  glyph:"&*\u00b7:"
};

/* twinkle grammar, after the coral fix in Animation 1 */
const TWINKLE = {steadyMin:0.48, steadyMax:0.72, brightBase:0.72, brightSwing:0.28,
                 speedMin:0.7, speedMax:1.6};

/* pacing, in milliseconds; everything slow */
const T = {
  typeStart:900,      /* the word begins to appear           */
  typeStep:320,       /* per letter                          */
  holdAfter:1800,     /* the word rests, complete: a breath   */
  arrivalStep:700,    /* clouds appear one after another      */
  arrivalGather:1300, /* a cloud gathers into its creature    */
  arrivalHold:2600,   /* the creature holds before loosening  */
  releaseWindow:7000, /* each letter leaves at its own moment
                         somewhere inside this window        */
  trickle:3400,       /* window over which a letter's cloud
                         streams out of it                   */
  flightMin:4800,     /* slowest ambient flight              */
  flightVar:2600,
  condense:1500,      /* touch: cloud into form              */
  disperseDelay:2300, /* attention gone: wait, then loosen   */
  disperse:2600
};

/* organic misalignment of the plate, per cloud, in px */
const JITTER = {
  "shooting-star":[-6,4], "coral":[5,-7], "seahorse":[3,6],
  "osprey":[7,2], "swallow":[-4,-5], "nightingale":[6,5],
  "moth-tiger":[-7,-3], "moth-hawk":[4,7], "moth-swallowtail":[-5,3],
  "asterisk":[0,-4], "star-seahorse":[0,2], "ampersand":[0,5]
};

/* =========================================================
   BUILD THE INVISIBLE PLATE
   ========================================================= */

const ringEl = document.getElementById("ring");

MOTIFS.forEach(m => {
  const a = document.createElement("a");
  a.className = "motif";
  a.id = "motif-" + m.id;
  a.href = m.href;
  a.setAttribute("aria-label", m.name);
  const entry = m.glyph ? (m.id === "ampersand" ? "introduction" : "about")
                        : m.name.split("\u00b7")[1].trim();
  a.innerHTML = `<div class="cloudbox"></div><span class="entry">${entry.replace(" & ", " &amp;<br>")}</span>`;
  ringEl.appendChild(a);
});

/* place the twelve on the circle; recalculated on resize */
function layoutRing(){
  /* five around an empty centre: the collar again */
  const W = ringEl.clientWidth;
  const r = W * 0.33;
  MOTIFS.forEach(m => {
    const a = document.getElementById("motif-" + m.id);
    const th = m.angle * Math.PI/180;
    const cell = m.glyph ? W * 0.11 : W * 0.26;
    a.style.left = (W/2 + r*Math.sin(th)) + "px";
    a.style.top  = (W/2 - r*Math.cos(th)) + "px";
    a.style.width = cell + "px";
  });
}
layoutRing();

/* =========================================================
   THE CLOUD ENGINE
   Twelve clouds of letters. Each floats until touched;
   touch condenses it into its form; when attention moves
   on, it loosens back into weather. The photonic four
   finish their condensation as points, the way the morphs
   are made; the rest remain letterform throughout.
   ========================================================= */

const canvas = document.getElementById("cloud");
const ctx = canvas.getContext("2d");
let DPR = 1;
function sizeCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * DPR;
  canvas.height = innerHeight * DPR;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
}
sizeCanvas();

function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
const WORD_HEX = "#dac7db";
function mixHex(a, b, t){
  t = Math.round(t*6)/6;
  const A = hexRGB(a), B = hexRGB(b);
  return "#" + [0,1,2].map(i => Math.round(A[i] + (B[i]-A[i])*t).toString(16).padStart(2,"0")).join("");
}
function easeInOut(t){return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2}
function easeOut(t){return 1-Math.pow(1-t,3)}
function clamp01(t){return t<0?0:(t>1?1:t)}

/* sprite cache: one small canvas per letter, colour, and pixel
   size, rendered at exactly the size it will be drawn, so the
   letters stay crisp instead of being scaled down and blurred */
const spriteCache = new Map();
function sprite(ch, colorHex, px){
  const key = ch + "|" + colorHex + "|" + px;
  let s = spriteCache.get(key);
  if(s) return s;
  const side = Math.ceil(px * DPR * 1.7);
  const c = document.createElement("canvas");
  c.width = side; c.height = side;
  const g = c.getContext("2d");
  g.font = "400 " + (px*DPR) + "px " + getComputedStyle(document.body).fontFamily;
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = colorHex;
  g.fillText(ch, side/2, side/2 + px*DPR*0.04);
  spriteCache.set(key, s = c);
  return s;
}

const rand = (a,b)=>a + Math.random()*(b-a);
const gauss = ()=> (Math.random()+Math.random()+Math.random())/1.5 - 1;

const clouds = {};
MOTIFS.forEach(m => {
  const o = OUTLINES[m.id];
  const st = STYLE[m.id];
  const pool = CHARS[m.row];
  const n = o.pts.length/2;
  const parts = [];
  for(let k=0;k<n;k++){
    parts.push({
      tx:o.pts[k*2], ty:o.pts[k*2+1],
      ch:pool[Math.floor(Math.random()*pool.length)],
      deep:Math.random()<0.35,
      size:rand(0.045,0.075),           /* letter size as a share of the cell */
      hx:gauss()*0.5, hy:gauss()*0.5,   /* float home inside the blob        */
      wf:rand(0.10,0.24), wp:rand(0,6.283), wr:rand(3,7),
      twk:Math.random()<st.tw,
      steady:rand(TWINKLE.steadyMin,TWINKLE.steadyMax),
      sp:rand(TWINKLE.speedMin,TWINKLE.speedMax),
      ph:rand(0,6.283),
      flight:null, born:0,
      mx:0,my:0,mstart:0,mdur:0
    });
  }
  clouds[m.id] = {
    id:m.id, o, st, parts, m,
    anchor:document.getElementById("motif-"+m.id),
    box:document.querySelector("#motif-"+m.id+" .cloudbox"),
    jit:JITTER[m.id],
    dphase:rand(0,6.283),
    state:"pre",         /* pre, flying, floating, condensing, formed, dispersing */
    stateT:0, disperseTimer:null
  };
});

function frameOf(c){
  const r = c.box.getBoundingClientRect();
  const cx = r.left + r.width/2 + c.jit[0];
  const cy = r.top + r.height/2 + c.jit[1];
  const S = Math.min(r.width, r.height) * 0.94;
  /* the cloud's spread is the same for every creature; only the form is trimmed */
  const S0 = (c.id === "asterisk") ? S : ringEl.clientWidth * 0.26 * 0.94;
  return {cx, cy, S, S0, x:cx - c.o.w*S/2, y:cy - c.o.h*S/2};
}

/* the whole cloud drifts a little, like weather */
function cloudDrift(c, tS){
  return [Math.sin(tS*0.13 + c.dphase)*7, Math.cos(tS*0.10 + c.dphase*1.7)*6];
}

function floatPos(c, p, f, tS){
  const [dx,dy] = cloudDrift(c, tS);
  return [
    f.cx + dx + p.hx*f.S0*0.62 + Math.sin(tS*p.wf*2 + p.wp)*p.wr,
    f.cy + dy + p.hy*f.S0*0.62 + Math.cos(tS*p.wf*1.6 + p.wp)*p.wr
  ];
}
function formPos(c, p, f, tS, still){
  let x = f.x + p.tx*f.S, y = f.y + p.ty*f.S;
  if(!still){ x += Math.sin(tS*p.wf*3 + p.ph)*0.5; y += Math.cos(tS*p.wf*2.4 + p.ph)*0.5; }
  return [x,y];
}

function beginMorph(c, now, toState){
  const f = frameOf(c);
  const tS = now/1000;
  for(const p of c.parts){
    const from = (c.state === "formed" || c.state === "condensing")
      ? currentPos(c, p, f, now)
      : floatPos(c, p, f, tS);
    p.mx = from[0]; p.my = from[1];
    p.mstart = now + Math.random()*350;
    p.mdur = (toState === "condensing" ? T.condense : T.disperse) * rand(0.85,1.15);
  }
  c.state = toState; c.stateT = now;
}

function currentPos(c, p, f, now){
  const tS = now/1000;
  switch(c.state){
    case "floating": case "flying": return floatPos(c, p, f, tS);
    case "formed": return formPos(c, p, f, tS, false);
    case "condensing":{
      const e = easeInOut(clamp01((now - p.mstart)/p.mdur));
      const g = formPos(c, p, f, tS, true);
      return [p.mx + (g[0]-p.mx)*e, p.my + (g[1]-p.my)*e];
    }
    case "dispersing":{
      const e = easeInOut(clamp01((now - p.mstart)/p.mdur));
      const g = floatPos(c, p, f, tS);
      return [p.mx + (g[0]-p.mx)*e, p.my + (g[1]-p.my)*e];
    }
  }
  return floatPos(c, p, f, tS);
}

function condenseAmount(c, p, now){
  if(c.state === "formed") return 1;
  if(c.state === "condensing") return easeInOut(clamp01((now - p.mstart)/p.mdur));
  if(c.state === "dispersing") return 1 - easeInOut(clamp01((now - p.mstart)/p.mdur));
  return 0;
}

function drawCloud(c, now, reduced){
  const f = frameOf(c);
  const tS = now/1000;
  const base = c.st.base, deep = c.st.deep;
  const baseRGB = hexRGB(base), deepRGB = hexRGB(deep);
  let allDone = true;

  for(const p of c.parts){
    let x, y, alphaMul = 1, flightT = 1;

    if(c.state === "flying" && p.flight){
      const t = (now - p.flight.start)/p.flight.dur;
      if(t < 0){ allDone = false; continue; }
      if(t >= 1){
        p.flight = null;
      } else {
        allDone = false;
        const fl = p.flight, e = easeInOut(t), o = 1-e;
        const g = floatPos(c, p, f, tS);
        x = o*o*fl.x0 + 2*o*e*fl.cx + e*e*g[0];
        y = o*o*fl.y0 + 2*o*e*fl.cy + e*e*g[1];
        alphaMul = (t < 0.15 ? t/0.15 : 1) * 0.85;
        flightT = t;
      }
    }
    if(x === undefined){
      const pos = currentPos(c, p, f, now);
      x = pos[0]; y = pos[1];
      if(p.born){ alphaMul = clamp01((now - p.born)/2200); }
    }

    /* alpha: dim steady majority, bright oscillating twinklers */
    let alpha;
    if(reduced){ alpha = p.twk ? 0.9 : p.steady; }
    else if(p.twk){ alpha = TWINKLE.brightBase + TWINKLE.brightSwing*Math.sin(tS*p.sp*2 + p.ph); }
    else { alpha = p.steady; }
    alpha *= alphaMul;
    if(alpha <= 0.01) continue;

    const k = condenseAmount(c, p, now);       /* 0 cloud .. 1 form */
    /* in flight the characters keep the word's pale colour; the creature's
       palette arrives with them, blooming over the last part of the path */
    const bloom = flightT < 0.62 ? 0 : clamp01((flightT - 0.62)/0.38);
    const colorHex = bloom >= 1 ? (p.deep ? deep : base) : mixHex(WORD_HEX, p.deep ? deep : base, bloom);
    const size = p.size * f.S * (1 - 0.30*k) * (1 + 0.35*(1-flightT));  /* larger in flight, settling to size */

    /* photonic creatures finish as points, the way the morphs are made */
    const dotK = c.st.dots ? clamp01((k - 0.72)/0.28) : 0;
    const letterA = alpha * (1 - dotK);
    if(letterA > 0.015){
      const px = Math.max(3, Math.round(size));
      const s = sprite(p.ch, colorHex, px);
      ctx.globalAlpha = letterA;
      ctx.drawImage(s, x*DPR - s.width/2, y*DPR - s.height/2);
    }
    if(dotK > 0){
      const rgb = p.deep ? deepRGB : baseRGB;
      const A = alpha * dotK;
      const r = (size*0.34 + 0.9);
      ctx.globalAlpha = A*0.16;
      ctx.beginPath(); ctx.arc(x*DPR, y*DPR, r*2.3*DPR, 0, 6.2832);
      ctx.fillStyle = base; if(p.deep) ctx.fillStyle = deep;
      ctx.fill();
      ctx.globalAlpha = A;
      ctx.beginPath(); ctx.arc(x*DPR, y*DPR, r*DPR, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  if(c.state === "flying" && allDone) c.state = "floating";
}

/* ---------- attention ---------- */
const coarse = window.matchMedia("(hover: none)").matches;

function attend(c){
  if(!document.body.classList.contains("done") && !c.anchor.classList.contains("ready")) return;
  c.anchor.classList.add("touched");
  if(c.disperseTimer){ clearTimeout(c.disperseTimer); c.disperseTimer = null; }
  if(c.state === "floating" || c.state === "dispersing"){
    beginMorph(c, performance.now(), "condensing");
  }
}
function release(c, delay){
  if(c.disperseTimer) clearTimeout(c.disperseTimer);
  c.disperseTimer = setTimeout(()=>{
    c.anchor.classList.remove("touched");
    if(c.state === "formed" || c.state === "condensing"){
      beginMorph(c, performance.now(), "dispersing");
    }
  }, delay || T.disperseDelay);
}

Object.values(clouds).forEach(c => {
  c.anchor.addEventListener("mouseenter", ()=>attend(c));
  c.anchor.addEventListener("mouseleave", ()=>release(c));
  c.anchor.addEventListener("focus", ()=>attend(c));
  c.anchor.addEventListener("blur", ()=>release(c));
  c.anchor.addEventListener("click", e => {
    if(!document.body.classList.contains("done")){ e.preventDefault(); return; }
    /* on touch screens the first tap wakes the creature,
       the second follows it */
    if(coarse && c.state !== "formed"){
      e.preventDefault();
      attend(c);
      /* on touch, give the creature longer before it rests again */
      release(c, 6000);
    }
  });
});

/* completion of condensation */
setInterval(()=>{
  const now = performance.now();
  for(const c of Object.values(clouds)){
    if(c.state === "condensing" && now - c.stateT > T.condense + 700) c.state = "formed";
    if(c.state === "dispersing" && now - c.stateT > T.disperse + 700) c.state = "floating";
  }
}, 250);

/* =========================================================
   THE WORD
   Typed slowly, the way the title cards arrive. It rests,
   then the letters leave one by one, each becoming its
   cloud. The asterisk and ampersand gather later, on their
   own, uninvited. Clicking anywhere hurries the weather in.
   ========================================================= */

const wordEl = document.getElementById("word");
const LETTERS = "creaturely".split("");
const letterSpans = [];
LETTERS.forEach(ch => {
  const s = document.createElement("span");
  s.className = "ch";
  s.textContent = ch;
  wordEl.appendChild(s);
  letterSpans.push(s);
});

/* letter i releases the cloud of MOTIFS[i]; the two glyph
   clouds gather on their own after the word has gone */
/* each letter travels outward toward its own side of the ring:
   the leftmost letters feed the left of the circle, the rightmost
   the right, so the word breaks apart in place */
const LETTER_TO_CLOUD = ["moth-hawk","moth-tiger","moth-swallowtail","nightingale",
  "shooting-star","swallow","coral","osprey","seahorse","star-seahorse"];

let finished = false;
let timers = [];
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function releaseLetter(i){
  const c = clouds[LETTER_TO_CLOUD[i]];
  const lr = letterSpans[i].getBoundingClientRect();
  letterSpans[i].classList.add("out");
  const now = performance.now();
  c.state = "flying"; c.stateT = now;
  /* one shared path per letter: its characters leave in sequence and
     follow one another along the same curve, a ribbon rather than a burst */
  const lx = lr.left + lr.width/2, ly = lr.top + lr.height/2;
  const bendX = rand(-140,140), bendY = -rand(60,160);
  const n = c.parts.length;
  c.parts.forEach((p, idx) => {
    p.flight = {
      x0: lx + rand(-6,6), y0: ly + rand(-6,6),
      cx: lx + bendX + rand(-18,18), cy: ly + bendY + rand(-18,18),
      start: now + (idx/n)*T.trickle + Math.random()*140,
      dur: T.flightMin + Math.random()*T.flightVar*0.35
    };
  });
}

function gatherGlyph(id, delay){
  timers.push(setTimeout(()=>{
    const c = clouds[id];
    const now = performance.now();
    c.state = "floating"; c.stateT = now;
    for(const p of c.parts){ p.born = now + Math.random()*2600; }
  }, delay));
}

function settleAll(){
  const now = performance.now();
  for(const c of Object.values(clouds)){
    if(c.state === "pre" || c.state === "flying"){
      c.state = reduced ? "formed" : "floating";
      c.parts.forEach(p => { p.flight = null; p.born = reduced ? 0 : now; });
    }
  }
  const intro = document.getElementById("intro");
  if(intro) intro.remove();
  Object.values(clouds).forEach(c => c.anchor.classList.add("ready"));
  document.body.classList.add("done");
  finished = true;
}

function skip(){
  if(finished) return;
  timers.forEach(clearTimeout);
  settleAll();
}

function tick(now){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const c of Object.values(clouds)){
    if(c.state !== "pre") drawCloud(c, now, reduced);
  }
  if(!finished){
    const allOut = Object.values(clouds).every(c => c.state !== "pre" && c.state !== "flying");
    if(allOut) settleAll();
  }
  requestAnimationFrame(tick);
}

function run(){
  /* the whole word fades in together, rests, and fades out */
  timers.push(setTimeout(()=>letterSpans.forEach(s=>s.classList.add("in")), T.typeStart));
  const typed = T.typeStart + 2800;
  const wordOut = typed + T.holdAfter;
  timers.push(setTimeout(()=>{ wordEl.style.transition = "opacity 1400ms ease"; wordEl.style.opacity = "0"; }, wordOut));

  /* then the ring takes shape: each cloud appears in its colour, gathers
     into its creature the way the animations do, holds, and loosens */
  const ringStart = wordOut + 1500;
  const creatures = MOTIFS.filter(mm => !mm.glyph).sort((a,b)=>a.angle-b.angle);   /* clockwise from the top */
  let latest = ringStart;
  creatures.forEach((mm, i) => {
    const at = ringStart + i*T.arrivalStep;
    latest = Math.max(latest, at);
    timers.push(setTimeout(()=>{
      const c = clouds[mm.id], now = performance.now();
      c.state = "floating"; c.stateT = now;
      c.parts.forEach(p => { p.flight = null; p.born = now + Math.random()*900; });
    }, at));
    timers.push(setTimeout(()=>{
      const c = clouds[mm.id];
      beginMorph(c, performance.now(), "condensing");
      c.disperseTimer = setTimeout(()=>{ if(c.state === "formed" || c.state === "condensing") beginMorph(c, performance.now(), "dispersing"); c.anchor.classList.add("ready"); }, T.arrivalHold);
    }, at + T.arrivalGather));
  });
  gatherGlyph("asterisk", latest + 1800);
  timers.push(setTimeout(settleAll, latest + T.arrivalGather + T.arrivalHold + 600));
}

window.addEventListener("keydown", e=>{
  if(e.key === "Enter" || e.key === "Escape" || e.key === " "){
    if(!finished){ e.preventDefault(); skip(); }
  }
});
document.addEventListener("click", ()=>{ if(!finished) skip(); });
window.addEventListener("resize", ()=>{ sizeCanvas(); layoutRing(); });

requestAnimationFrame(tick);
/* returning from a glossary page: no ceremony, the ring simply fades in */
const returning = location.hash === "#door" ||
  (document.referrer && (()=>{ try{ return new URL(document.referrer).origin === location.origin; }catch(e){ return false; } })());
if(reduced){ settleAll(); }
else if(returning){
  document.body.style.opacity = "0";
  settleAll();
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    document.body.style.transition = "opacity 700ms ease";
    document.body.style.opacity = "1";
  }); });
}
else {
  const start = ()=>run();
  if(document.fonts && document.fonts.ready){
    let started = false;
    const go = ()=>{ if(!started){ started = true; start(); } };
    document.fonts.ready.then(go);
    setTimeout(go, 1600);
  } else start();
}

/* soft departure into the glossary */
document.querySelectorAll(".motif").forEach(a=>{
  a.addEventListener("click", e=>{
    const href = a.getAttribute("href");
    if(!href || href === "#") return;
    e.preventDefault();
    document.body.style.transition = "opacity 480ms ease";
    document.body.style.opacity = "0";
    setTimeout(()=>{ location.href = href; }, 480);
  });
});

/* if the browser restores this page from its cache (returning from a glossary
   page), it comes back exactly as it left: faded out, clock stopped. start fresh. */
window.addEventListener("pageshow", e=>{
  if(e.persisted){ location.reload(); return; }
});
</script>
