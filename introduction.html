<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>creaturely · introduction</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f8fefe;
  --ink:#2B2E28;
  --ink-soft:#5A5E55;
  --moss:#6E7F5C;
  --lichen:#9FAF92;
  --light-green:#C4CFB6;
  --wing:#6B5844;
  --madder:#8C4A32;
  --silver:#C9CCC6;
  --silver-deep:#8A8D87;
  --epigraph:#8CA3B5;
  --panel:#FAFBF9;
  --serif:"EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;
  --sans:"Avenir Next","Avenir",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --measure:34rem;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--serif);font-size:1.18rem;line-height:1.62;
  font-feature-settings:"liga" 1,"onum" 1;
}
.wrap{max-width:var(--measure);margin:0 auto;padding:0 1.5rem}
.bleed{max-width:52rem;margin:0 auto;padding:0 1.5rem}

a.home{
  position:absolute;top:1.2rem;left:1.4rem;
  font-family:var(--sans);font-size:0.64rem;letter-spacing:0.26em;text-transform:uppercase;
  color:var(--silver-deep);text-decoration:none;
}
a.home:hover,a.home:focus-visible{color:var(--ink)}
a.home:focus-visible{outline:1px solid var(--epigraph);outline-offset:3px}

header.wrap{padding:5.5rem 1.5rem 0.6rem;text-align:center}
.kicker{
  font-family:var(--sans);font-size:0.64rem;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--silver-deep);margin:0 0 1.1rem;
}
h1{
  font-weight:400;font-size:clamp(2.4rem,7vw,3.4rem);letter-spacing:0.02em;
  margin:0;line-height:1.05;
}
.sub{
  font-style:italic;color:var(--ink-soft);font-size:1.15rem;margin:0.8rem 0 0;
}

section.wrap{margin:2.8rem auto}
.seckick{
  font-family:var(--sans);font-size:0.62rem;letter-spacing:0.28em;text-transform:uppercase;
  color:var(--moss);margin:0 0 1rem;
}
p{margin:0 0 1.25rem}
em{font-style:italic}

/* ---------- panels ---------- */
.panel{
  background:var(--panel);border:1px solid var(--silver);border-radius:6px;
  padding:1.4rem 1.4rem 1.5rem;margin:1.8rem 0;
}
.panel .plabel{
  font-family:var(--sans);font-size:0.6rem;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--silver-deep);margin:0 0 0.9rem;
}

/* the cutter */
#cutIn{
  width:100%;font-family:var(--serif);font-size:1.15rem;color:var(--ink);
  background:#fff;border:1px solid var(--silver);border-radius:4px;
  padding:0.6rem 0.8rem;
}
#cutIn:focus{outline:1px solid var(--epigraph);outline-offset:2px}
#chips{margin:1.1rem 0 0.4rem;line-height:2.35}
.chip{
  display:inline-block;position:relative;
  font-size:1.02rem;padding:0.1rem 0.45rem;margin:0 0.22rem 0.35rem 0;
  border-radius:3px;border:1px solid;
  white-space:pre;
}
.chip .sp{color:var(--silver-deep);opacity:0.85}
.chip .id{
  display:block;font-family:var(--sans);font-size:0.58rem;letter-spacing:0.04em;
  color:var(--silver-deep);text-align:center;margin-top:-1px;
}
.c0{background:rgba(110,127,92,0.13);border-color:rgba(110,127,92,0.45)}
.c1{background:rgba(140,163,181,0.15);border-color:rgba(140,163,181,0.5)}
.c2{background:rgba(107,88,68,0.11);border-color:rgba(107,88,68,0.4)}
.c3{background:rgba(159,175,146,0.16);border-color:rgba(159,175,146,0.55)}
.cm{background:rgba(140,74,50,0.12);border-color:rgba(140,74,50,0.5)}
.cutmeta{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  margin-top:0.5rem;flex-wrap:wrap;
}
.count{font-style:italic;color:var(--ink-soft);font-size:1rem}
button.quiet{
  font-family:var(--sans);font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--ink-soft);background:none;border:1px solid var(--silver);border-radius:3px;
  padding:0.45rem 0.8rem;cursor:pointer;
}
button.quiet:hover{color:var(--ink);border-color:var(--silver-deep)}
button.quiet[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button.quiet:focus-visible{outline:1px solid var(--epigraph);outline-offset:3px}

/* strawberry */
#views{margin-top:0.9rem}
.viewbtns{display:flex;gap:0.6rem;margin-bottom:1.1rem}
#yourview .letters{
  font-size:1.7rem;letter-spacing:0.35em;text-align:center;margin:0.8rem 0 0.5rem;
}
#yourview .letters b{font-weight:500;color:var(--madder)}
.viewnote{font-style:italic;color:var(--ink-soft);font-size:1rem;text-align:center;margin:0.4rem 0 0.2rem}
#itsview .chips{text-align:center;margin:1rem 0 0.4rem}
.hidden{display:none}

/* map */
#map3{width:100%;height:380px;display:block;cursor:grab;touch-action:none;border-radius:4px}
#map3.dragging{cursor:grabbing}
#map{width:100%;height:auto;display:block}
#map text{font-family:var(--serif);font-style:italic;font-size:13px;fill:var(--ink-soft);cursor:pointer}
#map text.idlabel{font-family:var(--sans);font-style:normal;font-size:9px;letter-spacing:0.05em;fill:var(--silver-deep);opacity:0;pointer-events:none}
#map .on text.idlabel{opacity:1}
#map circle{cursor:pointer}
#map .dot{fill:var(--silver-deep)}
#map .halo{fill:none;stroke:var(--epigraph);stroke-width:1.2;opacity:0}
#map line{stroke:var(--epigraph);stroke-width:1;opacity:0}
#map .on .halo{opacity:0.9}
#map text.hot{fill:var(--ink)}
#map .picked .dot{fill:var(--madder)}
#map .centre text:not(.idlabel){font-style:normal;font-weight:500;fill:var(--ink)}
#strips{margin-top:1rem}
.strip{margin:0.7rem 0}
.strip .slabel{font-style:italic;color:var(--ink-soft);font-size:1rem;margin-bottom:0.25rem}
.bands{display:flex;height:24px;border:1px solid var(--silver);border-radius:3px;overflow:hidden}
.bands i{flex:1}
.bands.vals{height:auto}
.bands.vals i{display:flex;align-items:center;justify-content:center;padding:0.32rem 0;font-style:normal}
.bands.vals b{font-family:var(--sans);font-weight:400;font-size:0.66rem;color:var(--ink);
  background:rgba(255,255,255,0.55);border-radius:2px;padding:0 0.2rem}
.stripshint{font-style:italic;color:var(--silver-deep);font-size:0.95rem;margin-top:0.6rem}

/* prices */
.lang{display:grid;grid-template-columns:7.5rem 1fr 3rem;gap:0.7rem;align-items:center;margin:0.55rem 0}
.lang .lname{font-style:italic;color:var(--ink-soft);font-size:1rem}
.lang .bar{height:12px;border-radius:2px;background:var(--silver);position:relative;overflow:hidden}
.lang .bar i{position:absolute;inset:0;width:0;background:var(--silver-deep);border-radius:2px;
  transition:width 1200ms ease}
.lang:first-of-type .bar i{background:var(--moss)}
.lang .n{font-family:var(--sans);font-size:0.72rem;color:var(--ink-soft);text-align:right}
.lang .sent{grid-column:2/4;font-size:0.92rem;color:var(--silver-deep);margin-top:-0.35rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* shadow line and honest note */
.shadow{
  margin:3rem 0 0;font-size:1.18rem;
}
.note{
  margin:3.4rem 0 0;padding-top:1.4rem;border-top:1px solid var(--silver);
}
.note .nkick{
  font-family:var(--sans);font-size:0.6rem;letter-spacing:0.28em;text-transform:uppercase;
  color:var(--silver-deep);margin:0 0 0.8rem;
}
.note p{font-size:0.98rem;color:var(--ink-soft);margin-bottom:0.9rem}
.terms{margin-top:2rem;font-family:var(--sans);font-size:0.66rem;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--silver-deep)}
.terms b{font-weight:400;color:var(--moss)}

footer{padding:3.5rem 0 3rem;text-align:center}
footer p{
  font-family:var(--sans);font-size:0.6rem;letter-spacing:0.26em;text-transform:uppercase;
  color:var(--silver-deep);margin:0;
}
@media (max-width:560px){
  body{font-size:1.08rem}
  .lang{grid-template-columns:5.5rem 1fr 2.6rem}
}

/* in the poems: the recurring connection */
.poem{
  margin:2.6rem 0 0;border-left:2px solid var(--epigraph);
  padding:0.15rem 0 0.15rem 1.1rem;
}
.poem .pkick{
  font-family:var(--sans);font-size:0.6rem;letter-spacing:0.28em;text-transform:uppercase;
  color:var(--epigraph);margin:0 0 0.4rem;
}
.poem p{font-style:italic;color:var(--ink-soft);font-size:1.05rem;margin:0}
/* sources */
.sources{margin-top:2.4rem;border-top:1px solid var(--silver);padding-top:1.1rem}
.sources .skick{font-family:var(--sans);font-size:0.6rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--silver-deep);margin:0 0 0.7rem}
.sources p{font-size:0.85rem;color:var(--ink-soft);line-height:1.65;margin:0 0 0.55rem}
.kicker a{color:inherit;text-decoration:none}
.kicker a:hover{text-decoration:underline;text-underline-offset:3px}
body{animation:pagein 620ms ease both}
@keyframes pagein{from{opacity:0}}
.note details{margin-top:0.7rem}
.note summary{cursor:pointer;font-family:var(--sans);font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--silver-deep);list-style:none}
.note summary::-webkit-details-marker{display:none}
.note summary::before{content:"+ ";}
.note details[open] summary::before{content:"\2013 ";}
.note details p{margin-top:0.55rem}
.colophon{margin-top:2.2rem;padding-top:0.9rem;border-top:1px solid var(--silver);font-family:var(--sans);font-size:0.62rem;letter-spacing:0.08em;color:var(--silver-deep);line-height:1.7}
.colophon a{color:inherit;text-decoration:none;border-bottom:1px solid var(--silver)}
.sources a{color:inherit;text-decoration:none;border-bottom:1px solid var(--silver)}
.sources a:hover{border-bottom-color:var(--ink-soft)}
.seckick{margin-top:2.6rem}
.wrap > .seckick:first-child{margin-top:0}
h1.long{font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.25;letter-spacing:0.01em;max-width:34ch;margin:0 auto}
h1.long em{font-style:italic}
</style>
</head>
<body>


<header class="wrap">
  <p class="kicker"><a href="glossary.html#ring">creaturely: a glossary &middot; &amp;</a></p>
  <h1 class="long">on <em>creaturely</em></h1>
</header>

<main>
<section class="wrap">
  <p>The essay that introduces <em>creaturely</em> is not on the site at the moment. It will return here.</p>
  <p class="colophon">&copy; 2026 Alexandra Emberley. This glossary was written and built by Alexandra Emberley in collaboration with a large language model, as part of <em>creaturely</em>.</p>
</section>
</main>

<script>
window.addEventListener("pageshow", e=>{
  if(e.persisted){ document.body.style.animation = "none"; document.body.style.transition = "none"; document.body.style.opacity = "1"; }
});
document.querySelectorAll(".kicker a").forEach(a=>{
  a.addEventListener("click", e=>{
    e.preventDefault();
    document.body.style.animation = "none";   /* release the arrival fade so the departure can run */
    document.body.style.transition = "opacity 440ms ease";
    document.body.style.opacity = "0";
    setTimeout(()=>{ location.href = a.href; }, 440);
  });
});
</script>
<script data-goatcounter="https://aemberley.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
